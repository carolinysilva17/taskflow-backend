spring:
  application:
    name: taskflow-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/taskflow}
    username: ${DB_USERNAME:taskflow}
    password: ${DB_PASSWORD:taskflow}

  jpa:
    hibernate:
      ddl-auto: validate

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-ms: 900000
  refresh-token-expiration-ms: 604800000
  refresh-cookie-secure: ${JWT_REFRESH_COOKIE_SECURE:true}
  refresh-cookie-same-site: ${JWT_REFRESH_COOKIE_SAME_SITE:None}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

rate-limit:
  login:
    max-attempts: ${RATE_LIMIT_LOGIN_MAX_ATTEMPTS:5}
    window-minutes: ${RATE_LIMIT_LOGIN_WINDOW_MINUTES:15}
  register:
    max-attempts: ${RATE_LIMIT_REGISTER_MAX_ATTEMPTS:10}
    window-minutes: ${RATE_LIMIT_REGISTER_WINDOW_MINUTES:60}
