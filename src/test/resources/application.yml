spring:
  application:
    name: taskflow-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/taskflow}
    username: ${DB_USERNAME:taskflow}
    password: ${DB_PASSWORD:taskflow}

  jpa:
    hibernate:
      ddl-auto: validate

jwt:
  secret: ${JWT_SECRET:test-secret-key-with-at-least-32-characters-long}
  access-token-expiration-ms: 900000
  refresh-token-expiration-ms: 604800000
  refresh-cookie-secure: false
  refresh-cookie-same-site: Lax

cors:
  allowed-origins: http://localhost:5173
